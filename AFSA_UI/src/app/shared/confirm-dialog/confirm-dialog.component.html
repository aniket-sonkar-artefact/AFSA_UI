<div class="confirm-overlay" (click)="onBackdropClick()">
  <div class="confirm-card" role="alertdialog" aria-modal="true" [attr.aria-label]="title" (click)="onCardClick($event)">
    <div class="confirm-icon">!</div>

    <h2 class="confirm-title">{{ title }}</h2>

    <p class="confirm-message">
      @for (segment of segments; track $index) {
        @if (segment.emphasis) {
          <strong>{{ segment.text }}</strong>
        } @else {
          <span>{{ segment.text }}</span>
        }
      }
    </p>

    @if (warning) {
      <div class="confirm-warning">{{ warning }}</div>
    }

    <div class="confirm-actions">
      <button type="button" class="confirm-cancel" [disabled]="confirming" (click)="cancelled.emit()">
        {{ cancelLabel }}
      </button>
      <button type="button" class="confirm-confirm" [disabled]="confirming" (click)="confirmed.emit()">
        {{ confirming ? confirmingLabel : confirmLabel }}
      </button>
    </div>
  </div>
</div>
