<div class="period-toggle" [class.variant-tabs]="variant === 'tabs'" [style.--option-count]="options.length">
  <div class="period-toggle-thumb" [style.transform]="'translateX(' + (selectedIndex * 100) + '%)'"></div>
  @for (option of options; track option.value) {
    <button
      type="button"
      class="period-toggle-option"
      [class.active]="option.value === selected"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
